name: Academia CFOP — APK Android
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK instalável
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: academia-cfop-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
