<body><div id="root"></div><script>
(function(){
 var ready=false;
 window.addEventListener('cfop:ready',function(){ready=true;});
 function show(){
  if(ready||document.querySelector('#root .app'))return;
  var root=document.getElementById('root');
  if(!root)return;
  root.innerHTML='<main style="max-width:540px;margin:12vh auto;padding:30px;border-radius:20px;background:#171e30;color:#f4f0ff;font:16px system-ui"><h1>Não foi possível carregar esta página</h1><p>Uma parte do aplicativo não iniciou. Atualize a página para tentar novamente.</p><button id="cfop-retry" style="background:#8e67ef;color:white;border:0;border-radius:12px;padding:12px 20px;cursor:pointer">Atualizar página</button></main>';
  document.getElementById('cfop-retry').onclick=function(){location.reload()};
 }
 window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT')show()},true);
 window.addEventListener('unhandledrejection',function(){setTimeout(show,300)});
 setTimeout(show,5500);
})();
</script><script type="module" src="./v2/app.js?v=20261030-22"></script><script defer src="./v2/cursor-glow.js?v=20261030-31"></script>
</body>
</html>
