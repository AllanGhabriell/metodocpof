<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CROSS — Academia CFOP</title>
<link rel="stylesheet" href="assets/css/global.css?v=20260313k">
<link rel="stylesheet" href="assets/css/cross-original.css?v=1">
<link rel="stylesheet" href="assets/css/cursor-glow.css?v=1">
<link rel="stylesheet" href="assets/css/academy.css?v=20261030-1">
<link rel="stylesheet" href="assets/css/cross-v2.css?v=20261030-20">
<link rel="stylesheet" href="assets/css/cross-physical.css?v=20261031-1">
</head>
<body data-set="cross">
<header class="topbar"><a href="index.html" class="icon-btn" aria-label="Voltar à página inicial">✕</a><span class="cross-top-label">CROSS</span><a href="studio.html?page=profile" class="icon-btn cross-account" aria-label="Conta e perfil">☰</a></header>
<main class="cross-original-main"><div id="cross-root"><p>Carregando treino de cruz…</p></div></main>
<script type="module">
import {crossPage,crossClick,crossChange} from './v2/features/cross.mjs?v=20261030-8';
import {physicalCrossPage,physicalCrossAction,physicalCrossChange,physicalCrossBind,physicalCrossBusy,physicalCrossSuspend} from './v2/features/cross-physical.mjs?v=20261031-1';
const root=document.getElementById('cross-root');
const TAB='academy-cross-active-tab-v1';
let tab='physical';
try{tab=localStorage.getItem(TAB)==='simulator'?'simulator':'physical'}catch{}
function render(){
 root.innerHTML='<nav class="cross-mode-switch" aria-label="Tipo de treino de cruz">'+
  '<button type="button" data-cross-tab="physical" aria-pressed="'+(tab==='physical')+'">Treino com cubo físico</button>'+
  '<button type="button" data-cross-tab="simulator" aria-pressed="'+(tab==='simulator')+'">Simulador</button></nav>'+
  (tab==='physical'?physicalCrossPage():crossPage());
 if(tab==='physical')physicalCrossBind(render);
}
function earn(type,xp){
 try{
  const key='cfop-studio-progress-v1',state=JSON.parse(localStorage.getItem(key)||'{}');
  const date=new Date();
  const day=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
  const records=Array.isArray(state.records)?state.records:[];
  records.push({type,xp,date:day,time:Date.now()});state.records=records.slice(-1500);
  localStorage.setItem(key,JSON.stringify(state));
 }catch{}
}
root.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 if(button.dataset.crossTab){
  const chosen=button.dataset.crossTab;if(chosen===tab)return;
  if(tab==='physical'&&physicalCrossBusy()&&!confirm('Abandonar a tentativa em andamento? O tempo não será salvo.'))return;
  physicalCrossSuspend();tab=chosen;
  try{localStorage.setItem(TAB,tab)}catch{}
  render();return;
 }
 if(tab==='physical'){if(physicalCrossAction(button))render()}
 else if(crossClick(button,earn))render();
});
root.addEventListener('change',e=>{
 if(tab==='physical'){if(physicalCrossChange(e.target))render()}
 else if(crossChange(e.target))render();
});
document.addEventListener('keydown',e=>{
 if(tab!=='physical'||e.code!=='Space'||e.repeat||e.defaultPrevented)return;
 if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName))return;
 e.preventDefault();
 if(physicalCrossAction({dataset:{crossPhysical:'clock'}}))render();
});
render();
</script>
<script src="v2/cursor-glow.js?v=20261030-27" defer></script>
<script type="module" src="assets/js/notice-banner.js?v=20261031-2"></script>
</body>
</html>
