<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081629">
<title>Cross Timer — Academia CFOP</title>
<link rel="stylesheet" href="assets/css/global.css?v=20260313k">
<link rel="stylesheet" href="assets/css/cross-original.css?v=1">
<link rel="stylesheet" href="assets/css/cursor-glow.css?v=1">
<link rel="stylesheet" href="assets/css/academy.css?v=20261030-1">
<link rel="stylesheet" href="assets/css/cross-v2.css?v=20261030-20">
<link rel="stylesheet" href="assets/css/cross-lab.css?v=20261031-1">
</head>
<body data-set="cross">
<header class="topbar"><a href="index.html" class="icon-btn" aria-label="Voltar à página inicial">✕</a><span class="cross-top-label">CROSS · TIMER</span><a href="studio.html?page=profile" class="icon-btn cross-account" aria-label="Conta e perfil">☰</a></header>
<main class="cross-original-main" id="cross-root"><p>Carregando Cross Timer…</p></main>
<script type="module">
import {crossPage,crossClick,crossChange} from './v2/features/cross.mjs?v=20261031-guided-1';
import {crossTimerPage,crossTimerAction,crossTimerChange,crossTimerBind,crossTimerBusy,crossTimerSuspend,crossTimerSetLevel} from './v2/features/cross-timer.mjs?v=20261031-1';
import {crossIdeasPage,crossIdeasAction} from './v2/features/cross-ideas.mjs?v=20261031-1';
const root=document.getElementById('cross-root');
let section='timer',ideasOpen=false;
function render(){
 const heading=section==='timer'?
 '<div class="cross-lab-top"><div><span class="cross-kicker">ACADEMIA CFOP</span><strong>Cross · treinamento especializado</strong></div><button type="button" class="cross-lab-sim-link" data-cross-section="simulator">◇ Simulador guiado</button></div>':
 '<div class="cross-lab-top"><button type="button" class="cross-lab-back" data-cross-section="timer">← Voltar ao timer</button><span>Simulação e aprendizado</span></div>';
 root.innerHTML=heading+(section==='timer'?
  crossTimerPage()+'<details id="cross-ideas-disclosure" class="cross-lab-ideas-disclosure" '+(ideasOpen?'open':'')+'><summary><span>✦ Ideias de treino</span><small>Básico · Intermediário · Avançado</small><span aria-hidden="true" class="cross-lab-chevron">⌄</span></summary>'+crossIdeasPage()+'</details>':
  crossPage());
 if(section==='timer')crossTimerBind(render);
}
function award(type,xp){
 try{
  const key='cfop-studio-progress-v1',state=JSON.parse(localStorage.getItem(key)||'{}'),now=new Date();
  const today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
  const records=Array.isArray(state.records)?state.records:[];
  if(records.some(x=>x.type===type&&x.date===today))return;
  records.push({type,xp:0,date:today,time:Date.now()});state.records=records.slice(-1500);
  localStorage.setItem(key,JSON.stringify(state));
 }catch{}
}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.crossSection){
  const next=b.dataset.crossSection;if(next===section)return;
  if(section==='timer'&&crossTimerBusy()&&!confirm('Abandonar a tentativa atual? O tempo não será salvo.'))return;
  crossTimerSuspend();section=next;render();window.scrollTo({top:0,behavior:'smooth'});return;
 }
 if(section==='timer'){
  if(b.dataset.crossIdeas){
   const changed=crossIdeasAction(b,n=>{
    if(crossTimerSetLevel(n)){ideasOpen=false;window.scrollTo({top:0,behavior:'smooth'})}
   });
   if(changed)render();
   return;
  }
  if(crossTimerAction(b))render();
 }else if(crossClick(b,award))render();
});
root.addEventListener('change',e=>{
 if(section==='timer'){if(crossTimerChange(e.target))render()}
 else if(crossChange(e.target))render();
});
root.addEventListener('toggle',e=>{if(e.target.id==='cross-ideas-disclosure')ideasOpen=e.target.open},true);
document.addEventListener('keydown',e=>{
 if(section!=='timer'||e.code!=='Space'||e.repeat||e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey)return;
 if(['INPUT','SELECT','TEXTAREA','BUTTON','A','SUMMARY'].includes(document.activeElement?.tagName))return;
 e.preventDefault();if(crossTimerAction({dataset:{crossTimer:'clock'}}))render();
});
render();
</script>
<script src="v2/cursor-glow.js?v=20261030-27" defer></script>
<script type="module" src="assets/js/notice-banner.js?v=20261031-2"></script>
</body>
</html>
